name: Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ruff: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run linter
        run: |
          uv run ruff check .
