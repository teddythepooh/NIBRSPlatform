[project]
name = "nibrs"
version = "0.1.0"
description = "NIBRS data platform."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fbi-data-api==1.0.1",
    "polars==2.1.0",
    "python-dotenv==1.2.4",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]
